<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeetGieok – Meeting Prep Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a10;--card:#13131d;--card2:#191926;--line:#262638;--ind:#7c7cf5;--ind2:#c9c9fb;--txt:#f1f1f7;--mut:#8b8ba3;--red:#f0625f;--grn:#4ade80;--amb:#f5b04a;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#050508;color:var(--txt);font:14px/1.45 Inter,system-ui,sans-serif;display:flex;justify-content:center;align-items:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ind);outline-offset:2px}
#app{width:100%;max-width:410px;height:100%;max-height:860px;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0)}
@media(min-width:500px){#app{border-radius:34px;border:1px solid var(--line);height:min(860px,96vh)}}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:9px;background:#fff;color:#111;display:grid;place-items:center;font-weight:700;font-size:15px}
header b{display:block;font-size:14px}
header small{color:var(--ind);font-size:11px}
header .sp{flex:1}
.ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-size:13px}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
nav{display:flex;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));background:var(--bg)}
nav button{flex:1;display:grid;justify-items:center;gap:2px;color:var(--mut);font-size:11px;padding:4px}
nav button span{font-size:18px}
nav button.on{color:var(--ind)}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
h2{font-size:17px;font-weight:600;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:12px;color:var(--mut);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:#22224a;color:var(--ind2)}
.pill.g{background:#12321f;color:var(--grn)}.pill.r{background:#3a1717;color:#ff9a97}.pill.a{background:#3a2b12;color:var(--amb)}
.row{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#4a4ad0,#8b6cf0);display:grid;place-items:center;font-weight:600;flex:none}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:12px}
.hero{background:linear-gradient(135deg,#4a4ad8,#3a3aa8);border-radius:18px;padding:16px;margin:14px 0}
.btn{width:100%;padding:13px;border-radius:12px;background:var(--ind);color:#0d0d24;font-weight:600;margin-top:8px}
.btn.o{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.stats{display:flex;justify-content:space-around;text-align:center}
.stats b{font-size:18px;display:block}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl .card{position:relative}
.tl .card:before{content:"";position:absolute;left:-20px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--ind)}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--mut);flex:none;display:grid;place-items:center;font-size:12px}
.chk.on{background:var(--ind);border-color:var(--ind);color:#0d0d24}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{padding:6px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.tabs button.on{background:var(--ind);color:#0d0d24;border-color:var(--ind)}
.risk{border-color:#4a2222;background:#1a1012}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font:inherit;margin:4px 0 12px}
label{font-size:12px;color:var(--mut)}
.sw{width:40px;height:23px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ind)}.sw.on:after{left:20px}
.ov{position:absolute;inset:0;background:rgba(5,5,10,.94);z-index:5;padding:28px 22px;display:flex;flex-direction:column;overflow-y:auto}
.st{display:flex;gap:12px;padding:10px 0;opacity:.3;transition:opacity .4s}
.st.on{opacity:1}
.st i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ind);display:grid;place-items:center;font-style:normal;font-size:12px;flex:none}
.st.done i{background:var(--ind);color:#0d0d24}
.toast{position:absolute;left:16px;right:16px;bottom:80px;background:var(--ind2);color:#0d0d24;padding:12px;border-radius:12px;font-weight:500;z-index:9}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const S={screen:'auth',mode:'in',tab:'schedule',ptab:'active',memory:true,
 people:[{n:'Rahul Sharma',r:'Product Director · ABC Technologies',t:'10:30 AM',d:30,s:'Ready · Brief prepared'},{n:'Maya Lin',r:'FinTech Capital · Growth Synergy Sync',t:'1:15 PM',d:45,s:'Analyzing notes…'},{n:'Sarah Jenkins',r:'Design System Review · Quarterly Audit',t:'3:30 PM',d:50,s:'Needs debrief review'}],
 mine:[{t:'Send technical architecture doc',d:true},{t:'Send revised pricing proposal',d:true}],
 theirs:[{t:'Review pricing proposal with VP',d:true},{t:'Confirm API requirements',d:false}],
 log:[{d:'Sep 20',k:'Decision',t:'Commercial & Pricing Review',x:'Agreed to a 45-day Enterprise sandbox trial before annual lock-in.'},{d:'Sep 12',k:'Concern',t:'Technical Architecture Session',x:'Latency reservations over legacy ERP sync (>350ms).'},{d:'Sep 2',k:'First meeting',t:'Initial Discovery Discussion',x:'Discussed APAC expansion and modular pricing. Shared a story about a family robotics workshop.'}],
 tg:{prep:true,voice:true,sty:true,zero:true,bio:true,haptic:true}};
const ini=n=>n.split(' ').map(w=>w[0]).join('');
const nav=[['schedule','▦','Schedule'],['briefs','✦','Briefs'],['network','◎','Network'],['promises','✓','Promises'],['settings','⚙','Settings']];
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#app').append(t);setTimeout(()=>t.remove(),2600)}

function auth(){const up=S.mode==='up';
 return `<main style="padding-top:28px">
 <div class="logo" style="width:64px;height:64px;font-size:26px;margin:0 auto 14px;border-radius:18px">M</div>
 <p class="mono" style="text-align:center">${up?'Executive tier intelligence':'Executive intelligence node'}</p>
 <h1 style="text-align:center;margin:6px 0">${up?'Create your workspace':'MeetGieok'}</h1>
 <p class="mut" style="text-align:center;margin-bottom:20px">${up?'Prepare smarter with AI meeting dossiers and relationship memory.':'Remember. Prepare. Connect.'}</p>
 <button class="btn o" style="margin:0 0 8px" onclick="enter()">${up?'Sign up':'Continue'} with Google Workspace</button>
 <button class="btn o" style="margin:0 0 16px" onclick="enter()">${up?'Sign up':'Continue'} with Microsoft 365</button>
 ${up?'<label>Full name</label><input placeholder="Alex Rivera">':''}
 <label>Work email</label><input id="em" type="email" value="alex.rivera@enterprise.ai">
 <label>${up?'Create master password':'Master key'}</label><input id="pw" type="password" value="ExecutiveAccess2025!">
 <button class="btn" style="margin:0" onclick="enter()">${up?'Get started':'Log in to workspace'}</button>
 <p class="sm mut" style="text-align:center;margin-top:16px">${up?'Already have an account?':'No workspace yet?'} <a href="#" style="color:var(--ind2)" onclick="S.mode='${up?'in':'up'}';draw();return false">${up?'Sign in':'Create one'}</a></p>
 <p class="mono" style="text-align:center;margin-top:14px">SOC-2 Type II · zero-data retention</p></main>`}
function enter(){S.screen='app';draw()}

function schedule(){return `<p class="mono">THURSDAY, OCT 24 <span class="pill" style="float:right">Executive mode</span></p>
 <h1 style="margin-top:6px">Good morning, Alex</h1><p class="mut sm">It remembers the relationship, not just the meeting.</p>
 <div class="card stats" style="margin-top:14px"><div><b>3</b><span class="sm mut">Meetings</span></div><div><b>2</b><span class="sm mut">Open loops</span></div><div><b>1</b><span class="sm mut">Follow-up due</span></div></div>
 <div class="hero"><div class="row"><span class="sm">Up next · in 25 min</span><span class="grow"></span><span class="sm">10:30 AM</span></div><b style="font-size:20px">Rahul Sharma</b><p class="sm" style="opacity:.8">Product Director · ABC Technologies</p></div>
 <div class="card"><b>Relational memory agent</b><p class="sm mut" style="margin:6px 0 10px">Found 4 past meetings, 3 months of email history, 1 pending commitment from Rahul, and 3 suggested questions.</p>
 <button class="btn" style="margin:0" onclick="prep()">Prepare for this meeting</button></div>
 <h2>Today's agenda <small>3 events</small></h2>
 ${S.people.map(p=>`<div class="card row"><div class="av">${ini(p.n)}</div><div class="grow"><b>${p.n}</b><div class="sm mut">${p.r}</div><span class="pill ${p.s[0]==='R'?'g':''}" style="margin-top:6px">${p.s}</span></div><div style="text-align:right"><b class="sm">${p.t}</b><div class="sm mut">${p.d} min</div></div></div>`).join('')}
 <div class="card row"><div class="grow"><b>Catch-up recommended</b><div class="sm mut">No contact with Marcus Vance in 4 weeks.</div></div><button class="pill" onclick="toast('Nudge drafted for Marcus Vance')">Nudge</button></div>`}

function prep(){const steps=[['Collect past memory','Meetings, emails and tasks'],['Identify contact','Rahul Sharma · ABC Technologies'],['AI memory engine','History, commitments, open issues'],['AI reasoning','Summary, questions, meeting goal'],['Personalized meeting brief','Ready for you']];
 const o=document.createElement('div');o.className='ov';o.innerHTML=`<p class="mono">RELATIONAL MEMORY AGENT</p><h1 style="margin:6px 0 18px">Preparing your brief</h1>${steps.map((s,i)=>`<div class="st" id="s${i}"><i>${i+1}</i><div><b>${s[0]}</b><div class="sm mut">${s[1]}</div></div></div>`).join('')}<button class="btn" id="go" style="display:none" onclick="S.tab='briefs';this.parentNode.remove();draw()">Open brief</button>`;
 $('#app').append(o);
 steps.forEach((_,i)=>{setTimeout(()=>{$('#s'+i).classList.add('on');if(i>0){$('#s'+(i-1)).classList.add('done');$('#s'+(i-1)+' i').textContent='✓'}
  if(i===4){setTimeout(()=>{$('#s4').classList.add('done');$('#s4 i').textContent='✓';$('#go').style.display='block'},600)}},i*750)})}

function briefs(){return `<div class="row" style="margin-bottom:10px"><span class="mono">✦ DOSSIER READY</span><span class="grow"></span><span class="pill">Starts in 14 min</span></div>
 <div class="card"><div class="row"><div class="av" style="width:56px;height:56px;font-size:18px">RS</div><div><b style="font-size:18px">Rahul Sharma</b><div class="sm mut">Product Manager · ABC Technologies</div><span class="pill a" style="margin-top:6px">High priority</span></div></div>
 <p class="sm mut" style="margin-top:10px">Today · 10:30 – 11:00 AM · Google Meet</p></div>
 <div class="hero" style="margin-top:0"><p class="mono" style="color:#dcdcff">MEETING GOAL</p><b style="font-size:18px">Finalize integration timeline and sign off on API requirements.</b><p class="sm" style="opacity:.8;margin-top:6px">Get agreement before their product freeze on Friday.</p></div>
 <h2>Previous discussion <small>Sep 20</small></h2>
 <div class="card sm">• Product requirements finalized and approved across teams.<br>• API integration scope discussed; sandbox credentials issued.<br>• Tiered pricing proposed for the Enterprise Growth tier.</div>
 <h2>Mutual commitments <small>${[...S.mine,...S.theirs].filter(x=>x.d).length} of ${S.mine.length+S.theirs.length} resolved</small></h2>
 ${cl('Your commitments',S.mine,'mine')}${cl('Rahul\'s commitments',S.theirs,'theirs')}
 <h2>Open issues and risks</h2>
 <div class="card risk"><b>Integration timeline slippage</b><p class="sm mut">A delay past Friday risks pushing launch into next quarter.</p></div>
 <div class="card risk"><b>Multi-location support</b><p class="sm mut">Rahul asked whether EU/APAC nodes are included without a latency penalty.</p></div>
 <h2>Suggested questions</h2>
 <div class="card sm">Ask about his team's offsite in Austin last week before moving to the API sign-off.</div>
 <div class="card sm">Can you confirm the API requirements by Thursday?</div>
 <h2>After the meeting</h2>
 <textarea id="nt" rows="3" placeholder="What did you learn? New commitments, decisions, personal notes…"></textarea>
 <button class="btn" style="margin-top:0" onclick="save()">Update memory</button>`}
function cl(t,a,k){return `<div class="card"><b class="sm">${t}</b>${a.map((x,i)=>`<div class="row" style="padding:8px 0;cursor:pointer" onclick="tg2('${k}',${i})"><span class="chk ${x.d?'on':''}">${x.d?'✓':''}</span><span class="grow ${x.d?'mut':''}">${x.t}</span><span class="pill ${x.d?'g':'a'}">${x.d?'Done':'Pending'}</span></div>`).join('')}</div>`}
function tg2(k,i){S[k][i].d=!S[k][i].d;draw()}
function save(){const v=$('#nt').value.trim();if(!v)return toast('Add a note first.');
 S.log.unshift({d:'Today',k:'New',t:'Weekly product sync',x:v});S.tab='network';draw();toast('Memory updated. Ready for your next meeting.')}

function network(){return `<div class="row" style="margin-bottom:12px"><div class="av" style="width:52px;height:52px">RS</div><div class="grow"><b style="font-size:18px">Rahul Sharma</b><div class="sm mut">Product Director · ABC Technologies</div></div><span class="pill g">Active sync</span></div>
 <div class="card stats"><div><b>94%</b><span class="sm mut">Trust score</span></div><div><b>${3+S.log.length}</b><span class="sm mut">Meetings logged</span></div></div>
 <div class="card"><b class="sm">Personal rapport</b><p class="sm mut" style="margin-top:6px">His 9-year-old son joined the school robotics club. Prefers concise morning check-ins and avoids Friday afternoon calls. Coffee: double-shot flat white.</p></div>
 <h2>Relationship timeline</h2><div class="tl">${S.log.map(e=>`<div class="card"><div class="row"><span class="pill ${e.k==='Concern'?'r':e.k==='New'?'g':''}">${e.k}</span><span class="grow"></span><span class="sm mut">${e.d}</span></div><b style="display:block;margin:6px 0 2px">${e.t}</b><p class="sm mut">${e.x}</p></div>`).join('')}</div>`}

function promises(){const all=[...S.mine.map(x=>({...x,w:'You owe'})),...S.theirs.map(x=>({...x,w:'They owe'}))];const list=all.filter(x=>S.ptab==='active'?!x.d:x.d);
 return `<h1>Promises</h1><p class="mut sm" style="margin-bottom:14px">Open loops across every relationship.</p>
 <div class="tabs">${['active','completed'].map(t=>`<button class="${S.ptab===t?'on':''}" onclick="S.ptab='${t}';draw()">${t[0].toUpperCase()+t.slice(1)} (${all.filter(x=>t==='active'?!x.d:x.d).length})</button>`).join('')}</div>
 ${list.length?list.map(x=>`<div class="card"><div class="row"><div class="grow"><b>${x.t}</b><div class="sm mut">Rahul Sharma · Discussed Sep 20</div></div><span class="pill ${x.w==='You owe'?'a':'r'}">${x.w}</span></div></div>`).join(''):'<div class="card sm mut">Nothing here. Capture a promise after your next meeting.</div>'}
 <button class="btn o" onclick="toast('Promise captured')">+ Capture promise</button>`}

function settings(){const T=(k,t,d)=>`<div class="card row" style="cursor:pointer" onclick="S.tg.${k}=!S.tg.${k};draw()"><div class="grow"><b>${t}</b><div class="sm mut">${d}</div></div><span class="sw ${S.tg[k]?'on':''}"></span></div>`;
 return `<div class="card row"><div class="av">AR</div><div class="grow"><b>Alex Rivera</b><div class="sm mut">alex.rivera@enterprise.ai</div></div><span class="pill">Tier 1</span></div>
 <h2>AI intelligence engine</h2>
 ${T('prep','Prep timing','Push a brief 15 minutes before each call')}${T('voice','Voice capture and debrief','Extract nuance from post-meeting notes')}${T('sty','Executive brief style','Bullet points, risks and commitments')}
 <h2>Privacy and security</h2>
 ${T('zero','Zero-data retention','End-to-end encrypted memory')}${T('bio','Biometric lock','Face ID on app resume')}
 <button class="btn o" style="color:var(--red)" onclick="toast('Local cache cleared')">Clear AI memory cache</button>
 <button class="btn o" onclick="S.screen='auth';S.mode='in';draw()">Sign out</button>`}

const V={schedule,briefs,network,promises,settings};
function draw(){const a=$('#app');a.innerHTML='';
 if(S.screen==='auth'){a.innerHTML=auth();return}
 a.innerHTML=`<header><div class="logo">M</div><div><b>MeetGieok</b><small>● AI synced</small></div><span class="sp"></span><span class="ic">⌕</span><span class="ic">${ini('Alex Rivera')}</span></header><main>${V[S.tab]()}</main><nav>${nav.map(n=>`<button class="${S.tab===n[0]?'on':''}" onclick="S.tab='${n[0]}';draw()"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>`}
draw();
</script>
</body>
</html>
